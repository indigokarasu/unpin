<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body data-view="loading">
  <header class="brand">
    <img src="icons/icon-32.png" width="24" height="24" alt="">
    <span>Unpin</span>
  </header>

  <!-- Opening: the board is being read -->
  <section class="view" data-for="loading">
    <div class="cover skeleton"></div>
    <div class="line skeleton" style="width: 60%"></div>
    <div class="line skeleton short" style="width: 40%"></div>
  </section>

  <!-- Not on a board -->
  <section class="view empty" data-for="nowhere">
    <div class="empty-mark"><img src="icons/icon-128.png" width="56" height="56" alt=""></div>
    <h1 id="nowhere-title">Open a Pinterest board</h1>
    <p id="nowhere-body">Unpin downloads every image on a board, with a folder for each section.</p>
  </section>

  <!-- Board, before and during download -->
  <section class="view" data-for="board">
    <div class="cover" id="cover"></div>
    <h1 id="board-name"></h1>
    <p class="meta" id="board-meta"></p>
    <ul class="chips" id="sections"></ul>

    <div class="progress" id="progress" hidden>
      <div class="track" id="track"></div>
      <p class="meta" id="progress-text"></p>
    </div>

    <p class="error" id="error" hidden></p>

    <div class="actions">
      <button class="btn primary" id="download"></button>
      <button class="btn secondary" id="stop" hidden>Stop</button>
    </div>
  </section>

  <!-- Finished -->
  <section class="view done" data-for="done">
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6 12-12-1.4-1.4z" fill="currentColor"/></svg>
    </div>
    <h1 id="done-title"></h1>
    <p class="meta" id="done-detail"></p>
    <p class="path" id="done-path"></p>
    <div class="actions">
      <button class="btn primary" id="reveal">Show in Finder</button>
      <button class="btn secondary" id="again">Done</button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
